name: 持续集成

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: 格式、类型、测试与构建
    runs-on: ubuntu-latest
    env:
      # 仅用于生成客户端，不连接数据库；真实测试地址由集成测试任务提供。
      DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 检查生产依赖漏洞
        run: pnpm security:audit

      - name: 检查同侪依赖
        run: pnpm peers check

      - name: 生成 Prisma 客户端
        run: pnpm db:generate

      - name: 检查格式
        run: pnpm format:check

      - name: 检查类型
        run: pnpm typecheck

      - name: 检查 lint
        run: pnpm lint

      - name: 运行单元测试
        run: pnpm test

      - name: 构建生产包
        run: pnpm build

      - name: 校验 Compose 配置
        run: docker compose --env-file .env.example -f compose.yml config --quiet

  integration:
    name: PostgreSQL 业务闭环与恢复演练
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://max_promotion:test-only-password@127.0.0.1:55432/max_promotion_test?schema=public
      TEST_DATABASE_URL: postgresql://max_promotion:test-only-password@127.0.0.1:55432/max_promotion_test?schema=public
      SEED_DEMO_DATA: 'true'
      DEMO_ADMIN_USERNAME: ci-admin
      DEMO_ADMIN_PASSWORD: ci-admin-password
      DEMO_PROMOTER_USERNAME: ci-promoter
      DEMO_PROMOTER_PASSWORD: ci-promoter-password
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      WEB_ORIGIN: http://localhost:5173
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生成 Prisma 客户端
        run: pnpm db:generate

      - name: 启动临时 PostgreSQL
        run: |
          docker run --rm -d \
            --name max-promotion-test-db \
            -e POSTGRES_DB=max_promotion_test \
            -e POSTGRES_USER=max_promotion \
            -e POSTGRES_PASSWORD=test-only-password \
            -p 127.0.0.1:55432:5432 \
            postgres:17-alpine

      - name: 等待临时 PostgreSQL 就绪
        run: |
          for attempt in {1..30}; do
            if docker exec max-promotion-test-db pg_isready -U max_promotion -d max_promotion_test; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: 执行数据库迁移
        run: pnpm --filter @max-promotion/api prisma:migrate:deploy

      - name: 验证演示种子
        run: pnpm db:seed

      - name: 运行 PostgreSQL 业务闭环测试
        run: pnpm test:integration

      - name: 执行备份恢复与逐表核对
        run: |
          POSTGRES_CONTAINER=max-promotion-test-db \
          POSTGRES_USER=max_promotion \
          POSTGRES_PASSWORD=test-only-password \
          SOURCE_DB=max_promotion_test \
          TARGET_DB=max_promotion_restore_test \
          bash scripts/verify-backup-restore.sh

      - name: 验证每日备份脚本
        run: |
          POSTGRES_CONTAINER=max-promotion-test-db \
          POSTGRES_USER=max_promotion \
          POSTGRES_PASSWORD=test-only-password \
          POSTGRES_DB=max_promotion_test \
          BACKUP_DIR="$RUNNER_TEMP/max-promotion-backups" \
          BACKUP_RETENTION_DAYS=14 \
          bash scripts/backup-postgres.sh

          test "$(stat -c '%a' "$RUNNER_TEMP/max-promotion-backups")" = "700"
          test "$(find "$RUNNER_TEMP/max-promotion-backups" -maxdepth 1 -type f -name '*.dump' | wc -l)" -eq 1
          test "$(find "$RUNNER_TEMP/max-promotion-backups" -maxdepth 1 -type f -name '*.dump.sha256' | wc -l)" -eq 1
          test -z "$(find "$RUNNER_TEMP/max-promotion-backups" -maxdepth 1 -type f -name '.*.partial.*' -print -quit)"
          cd "$RUNNER_TEMP/max-promotion-backups"
          sha256sum -c ./*.dump.sha256

  images:
    name: 镜像构建与存活探针
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 校验 .dockerignore 覆盖关键目录
        run: |
          for pattern in 'node_modules' '**/dist' '.env'; do
            grep -qF -- "$pattern" .dockerignore || { echo "缺少 $pattern 规则"; exit 1; }
          done
          echo ".dockerignore 关键规则齐全"

      - name: 构建 API 镜像
        run: |
          docker build --progress=plain -f apps/api/Dockerfile -t max-promotion-api:ci . 2>&1 | tee /tmp/api-build.log
          grep -oE 'transferring context: [0-9.]+[kMGT]?B' /tmp/api-build.log | tail -1 || true

      - name: 构建 Web 镜像
        run: docker build -f apps/web/Dockerfile -t max-promotion-web:ci .

      - name: 启动临时 PostgreSQL 供 API 启动
        run: |
          docker network create smoke-net
          docker run --rm -d --name smoke-db --network smoke-net \
            -e POSTGRES_DB=max_promotion \
            -e POSTGRES_USER=max_promotion \
            -e POSTGRES_PASSWORD=smoke-only-password \
            postgres:17-alpine
          for attempt in {1..30}; do
            if docker exec smoke-db pg_isready -U max_promotion -d max_promotion; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: 启动 API 容器并验证存活探针
        run: |
          docker run --rm -d --name smoke-api --network smoke-net \
            -p 127.0.0.1:3100:3000 \
            -e DATABASE_URL='postgresql://max_promotion:smoke-only-password@smoke-db:5432/max_promotion?schema=public' \
            -e JWT_SECRET=ci-only-smoke-secret-at-least-32-characters \
            -e WEB_ORIGIN=http://127.0.0.1:3100 \
            max-promotion-api:ci
          code=000
          for attempt in {1..30}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/health/live || true)
            if [ "$code" = "200" ]; then
              echo "存活探针返回 200"
              break
            fi
            sleep 2
          done
          echo "最后一次探针状态码：$code"
          docker logs smoke-api | tail -20
          test "$code" = "200"

      - name: 清理临时容器
        if: always()
        run: |
          docker rm -f smoke-api smoke-db 2>/dev/null || true
          docker network rm smoke-net 2>/dev/null || true
