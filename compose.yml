name: max-promotion

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-max_promotion}
      POSTGRES_USER: ${POSTGRES_USER:-max_promotion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在 .env 设置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['pnpm', 'run', 'prisma:migrate:deploy']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-max_promotion}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-max_promotion}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      # 容器内的 WEB_ORIGIN 由 COMPOSE_WEB_ORIGIN 注入；生产必须设为正式域名（含协议），
      # 否则登录、刷新、注销会被来源校验判 403。
      WEB_ORIGIN: ${COMPOSE_WEB_ORIGIN:-http://localhost:8080}
      # 这里的默认值 false 会覆盖代码中 NODE_ENV=production 时默认开启 Secure 的逻辑，
      # 生产部署必须在 .env 显式设置 COOKIE_SECURE=true。
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-max_promotion}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-max_promotion}?schema=public
      JWT_SECRET: ${JWT_SECRET:?请先在 .env 设置至少 32 位的 JWT_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_TIMEOUT_MS: ${ALERT_WEBHOOK_TIMEOUT_MS:-5000}
      ALERT_COOLDOWN_MINUTES: ${ALERT_COOLDOWN_MINUTES:-15}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-0}
      AUDIT_CLEANUP_INTERVAL_HOURS: ${AUDIT_CLEANUP_INTERVAL_HOURS:-24}
      AUDIT_CLEANUP_BATCH_SIZE: ${AUDIT_CLEANUP_BATCH_SIZE:-1000}
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-loopback,linklocal,uniquelocal}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      LOGIN_ATTEMPT_RETENTION_HOURS: ${LOGIN_ATTEMPT_RETENTION_HOURS:-24}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - '3000'
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '${APP_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: max_promotion_postgres_data
